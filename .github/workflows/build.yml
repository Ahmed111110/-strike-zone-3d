name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Packages
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o sdk.zip
            unzip -qo sdk.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools$ANDROID_HOME/cmdline-tools/latest
          fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Create & Build Android APK
        run: |
          mkdir -p app/src/main/java/com/abusoliman/strikezone app/src/main/res/values
          cat << 'EOF' > settings.gradle
          rootProject.name = "StrikeZone"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.abusoliman.strikezone'
              compileSdk 34
              defaultConfig {
                  applicationId "com.abusoliman.strikezone"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Strike Zone"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Strike Zone</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/java/com/abusoliman/strikezone/MainActivity.java
          package com.abusoliman.strikezone;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private int tankHp = 100;
              private int modeIndex = 0;
              private final String[] modes = {"RPG", "شواظ", "هاون"};
              private final int[] dmg = {35, 50, 40};
              private final int[] ammo = {3, 3, 3};
              private TextView tvStatus;
              private Button btnMode;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#181C18"));
                  root.setPadding(36, 60, 36, 48);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("STRIKE ZONE - FIELD");
                  title.setTextColor(Color.parseColor("#D9C58E"));
                  title.setTextSize(24f);
                  title.setPadding(0, 0, 0, 24);
                  root.addView(title);

                  tvStatus = new TextView(this);
                  tvStatus.setTextColor(Color.WHITE);
                  tvStatus.setTextSize(18f);
                  tvStatus.setGravity(Gravity.CENTER);
                  tvStatus.setPadding(0, 20, 0, 40);
                  updateHud();
                  root.addView(tvStatus);

                  btnMode = new Button(this);
                  btnMode.setText("الوسيلة: " + modes[modeIndex]);
                  btnMode.setTextSize(18f);
                  btnMode.setOnClickListener(v -> {
                      modeIndex = (modeIndex + 1) % modes.length;
                      btnMode.setText("الوسيلة: " + modes[modeIndex]);
                      updateHud();
                  });
                  root.addView(btnMode);

                  Button btnFire = new Button(this);
                  btnFire.setText("إطلاق");
                  btnFire.setTextSize(20f);
                  btnFire.setBackgroundColor(Color.parseColor("#8C2D19"));
                  btnFire.setTextColor(Color.WHITE);
                  LinearLayout.LayoutParams fireParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 150);
                  fireParams.setMargins(0, 24, 0, 16);
                  btnFire.setLayoutParams(fireParams);
                  btnFire.setOnClickListener(v -> {
                      if (tankHp <= 0) return;
                      if (ammo[modeIndex] <= 0) {
                          tvStatus.setText("نفدت ذخيرة " + modes[modeIndex] + " — اضغط تلقيم");
                          return;
                      }
                      ammo[modeIndex]--;
                      tankHp = Math.max(0, tankHp - dmg[modeIndex]);
                      updateHud();
                  });
                  root.addView(btnFire);

                  Button btnReload = new Button(this);
                  btnReload.setText("تلقيم");
                  btnReload.setTextSize(18f);
                  btnReload.setOnClickListener(v -> {
                      ammo[modeIndex] = 3;
                      updateHud();
                  });
                  root.addView(btnReload);

                  Button btnReset = new Button(this);
                  btnReset.setText("جولة جديدة");
                  btnReset.setTextSize(18f);
                  LinearLayout.LayoutParams resetParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  resetParams.setMargins(0, 24, 0, 0);
                  btnReset.setLayoutParams(resetParams);
                  btnReset.setOnClickListener(v -> {
                      tankHp = 100;
                      for (int i = 0; i < ammo.length; i++) ammo[i] = 3;
                      updateHud();
                  });
                  root.addView(btnReset);

                  setContentView(root);
              }

              private void updateHud() {
